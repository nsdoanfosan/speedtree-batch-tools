name: tests

# The compile gate and the unit suites need no assets and no SpeedTree/Blender/
# Unreal. Production code imports PIL lazily, but a handful of test modules
# import Pillow and pytest at module level, so those two are installed.
#
# Windows is not incidental. The queue's liveness probe, the Job Object
# process ownership in process_stream, and the %LOCALAPPDATA% cache paths are
# all ctypes/OS specific, so a POSIX runner would skip the parts most worth
# checking.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # A subset of the suites loads the central SpeedTree policy module from
      # the substance-tools repository. It is checked out under work/ because
      # the compile gate ignores that directory, so vendoring it here cannot
      # change the production source revision the audit children verify.
      #
      # This used to pin bake-selection-and-painter-handoff, because
      # speedtree_handoff_contract.py and speedtree_handoff_vectors.json existed
      # only on that branch. That branch has since merged (substance-tools PR
      # #1) and all three files are byte-identical on main -- verified by blob
      # SHA: pipeline_contract.json 42a0c819, speedtree_handoff_contract.py
      # ca13f8cb, speedtree_handoff_vectors.json 4628f74a. Tracking main removes
      # the standing risk that deleting a merged branch turns every PR in this
      # repository red without a single code change.
      - uses: actions/checkout@v4
        with:
          repository: nsdoanfosan/substance-tools
          ref: main
          path: work/substance-tools

      - name: point at the shared contract
        shell: pwsh
        run: |
          $contract = Join-Path $env:GITHUB_WORKSPACE 'work\substance-tools\pipeline_contract.json'
          if (-not (Test-Path $contract)) {
            Write-Host "::error::pipeline_contract.json missing at $contract"
            exit 1
          }
          "SUBSTANCE_TOOLS_PIPELINE_CONTRACT=$contract" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Production code imports PIL lazily and there is no requirements file,
      # but test_pcg_texture_batch / test_pcg_step3_freshness import Pillow and
      # test_pipeline_plan_cli / test_push_dependency_schedule import pytest at
      # module level, and cluster_assembly_builder.fit_trs_transform needs numpy,
      # so unittest cannot even load or run them without these.
      - name: test-only dependencies
        run: python -m pip install --disable-pip-version-check --quiet pillow pytest numpy

      # Several suites build an expected path from tempfile.TemporaryDirectory()
      # and compare it against a value the production code has resolved(). On a
      # runner whose account name exceeds eight characters the default %TEMP%
      # resolves to its 8.3 short form (RUNNER~1 vs runneradmin) and those
      # comparisons fail -- a test-harness weakness, not a product defect: the
      # product canonicalizes correctly. Pinning TEMP to a short path keeps CI
      # measuring the product until the expectations are canonicalized too.
      #
      # The path below is the three characters C, :, \, t. It previously held a
      # literal TAB character, so New-Item failed with `The specified drive root
      # "C:\<tab>\" either does not exist` on every run and TEMP/TMP were set to
      # a path that does not exist; Python silently fell back to the default and
      # this step did nothing at all.
      - name: short temp path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'C:\t' | Out-Null
          "TEMP=C:\t" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=C:\t"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Fails in about a second on a syntax break or a contract drift, and
      # prints the production source revision the audit children verify
      # against, so a mismatch is visible here rather than mid-batch.
      - name: compile gate
        run: python sk_batch/code_compile_gate.py

      # Discovered rather than listed, so adding or renaming a suite needs no
      # change to this file. Every directory named `tests` is a suite; the
      # discovery root is its parent so the flat imports the suites rely on
      # keep working.
      - name: unit suites
        shell: pwsh
        run: |
          $failed = @()
          $empty = @()
          $total = 0
          $workRoot = Join-Path $env:GITHUB_WORKSPACE 'work'
          Get-ChildItem -Recurse -Directory -Filter tests |
            Where-Object {
              # work/ holds the vendored substance-tools checkout, whose own
              # suites are not this repository's to run or to gate on. Compared
              # as a path prefix rather than a regex so no escaping can slip.
              $_.FullName -notmatch '__pycache__' -and
              -not $_.FullName.StartsWith($workRoot, 'OrdinalIgnoreCase')
            } |
            Sort-Object FullName |
            ForEach-Object {
              $rel = Resolve-Path -Relative $_.FullName
              Write-Host "::group::$rel"
              $out = & python -m unittest discover -s $rel 2>&1 | Out-String
              Write-Host $out
              Write-Host "::endgroup::"
              if ($LASTEXITCODE -ne 0) { $failed += $rel }
              $m = [regex]::Match($out, 'Ran (\d+) test')
              if ($m.Success) {
                $count = [int]$m.Groups[1].Value
                $total += $count
                if ($count -eq 0) { $empty += $rel }
              } else {
                $empty += $rel
              }
            }
          Write-Host "총 $total tests"
          if ($failed.Count -gt 0) {
            Write-Host "::error::failed suites: $($failed -join ', ')"
            exit 1
          }
          # `unittest discover` exits 0 on "Ran 0 tests", so a suite that stops
          # being collected -- a renamed directory, a file no longer matching
          # test*.py, an import that quietly drops a module -- reads exactly
          # like a passing suite. These two tripwires make that loud. The floor
          # is deliberately far below the current count: it catches collapse,
          # it is not a target to keep bumping.
          if ($empty.Count -gt 0) {
            Write-Host "::error::suites collected zero tests: $($empty -join ', ')"
            exit 1
          }
          if ($total -lt 1500) {
            Write-Host "::error::collected only $total tests; expected at least 1500"
            exit 1
          }

      # `unittest discover` only collects TestCase methods, so a test written as
      # a module-level `def test_*` function is silently never run. There were
      # 73 of them across 9 files when this step was added -- including the
      # whole issue #65 regression file -- and pytest was already being
      # installed above purely so those files would import. Run them for real,
      # discovering the files by content so the list cannot rot.
      - name: module-level tests
        shell: pwsh
        run: |
          $workRoot = Join-Path $env:GITHUB_WORKSPACE 'work'
          $files = Get-ChildItem -Recurse -File -Filter 'test_*.py' |
            Where-Object {
              $_.FullName -notmatch '__pycache__' -and
              -not $_.FullName.StartsWith($workRoot, 'OrdinalIgnoreCase') -and
              (Select-String -Path $_.FullName -Pattern '^def test' -Quiet)
            } |
            Sort-Object FullName |
            ForEach-Object { Resolve-Path -Relative $_.FullName }
          if (-not $files) {
            Write-Host "::error::no module-level test functions found; this step expects at least one file"
            exit 1
          }
          Write-Host "module-level test files: $($files.Count)"
          $files | ForEach-Object { Write-Host "  $_" }
          python -m pytest @files -q
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::module-level tests failed"
            exit 1
          }

      # Byte-compiling the packages catches a source file that no suite
      # imports; `-q` keeps the log to actual errors.
      - name: compileall
        run: python -m compileall -q batch_ui_common cluster_card_pipeline pcg_st9_texture_batch sk_batch spm_generator_sync

      # A tracked file left modified means a test wrote into the checkout,
      # which would make results order-dependent.
      - name: no working-tree side effects
        shell: pwsh
        run: |
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Host "::error::tests modified tracked files:`n$dirty"
            exit 1
          }
