name: tests

# The compile gate and test suites need no assets and no SpeedTree/Blender/
# Unreal. Production code imports PIL lazily, but a handful of test modules
# import Pillow, pytest, or numpy at module level. pytest-xdist keeps the large
# independent suites from spending most of the job in one serial process.
#
# Windows is not incidental. The queue's liveness probe, the Job Object
# process ownership in process_stream, and the %LOCALAPPDATA% cache paths are
# all ctypes/OS specific, so a POSIX runner would skip the parts most worth
# checking.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseding a run is right on a pull request: the branch moved, so the older
# measurement is about a tree nobody will merge. It is wrong on main. Merges
# land here in bursts -- on 2026-08-02, six of seven main runs were cancelled
# by the next merge within fourteen minutes, so the only merge commit that was
# ever measured was the last one. main is not a protected branch and no check
# is required, so a cancelled push run is not a delayed verification, it is the
# absence of one: the tree every worktree branches from was never built.
#
# cancel-in-progress: false alone does not fix that. A group holds at most one
# running and one queued run: a third arrival cancels the queued one. Measured
# after that change landed -- runs 30749966767 and 30749994407, the merges of
# #132 and #131, were both cancelled while queued behind #133. So push runs get
# a group of their own, keyed by commit, and every merge commit is built. Pull
# requests keep the per-ref group where superseding is what you want.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt

      # A subset of the suites loads the central SpeedTree policy module from
      # the substance-tools repository. It is checked out under work/ because
      # the compile gate ignores that directory, so vendoring it here cannot
      # change the production source revision the audit children verify.
      #
      # This used to pin bake-selection-and-painter-handoff, because
      # speedtree_handoff_contract.py and speedtree_handoff_vectors.json existed
      # only on that branch. That branch has since merged (substance-tools PR
      # #1) and all three files are byte-identical on main -- verified by blob
      # SHA: pipeline_contract.json 42a0c819, speedtree_handoff_contract.py
      # ca13f8cb, speedtree_handoff_vectors.json 4628f74a. Tracking main removes
      # the standing risk that deleting a merged branch turns every PR in this
      # repository red without a single code change.
      - uses: actions/checkout@v7
        with:
          repository: nsdoanfosan/substance-tools
          ref: main
          path: work/substance-tools

      # The blob SHAs below include the cutout-opacity contract v3 merged by
      # substance-tools PR #2. Tracking a moving ref means a commit in the other
      # repository can change what this repository's suites are measured
      # against, silently and with no commit here. Comparing the blobs turns
      # that comment into a live tripwire: drift is annotated and recorded in
      # the job summary rather than discovered later as a mystery.
      # A warning, not a failure -- an intentional contract change upstream
      # should not block every PR here, it should be visible and then followed.
      - name: point at the shared contract
        shell: pwsh
        run: |
          $vendored = Join-Path $env:GITHUB_WORKSPACE 'work\substance-tools'
          $contract = Join-Path $vendored 'pipeline_contract.json'
          if (-not (Test-Path $contract)) {
            Write-Host "::error::pipeline_contract.json missing at $contract"
            exit 1
          }
          "SUBSTANCE_TOOLS_PIPELINE_CONTRACT=$contract" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $expected = [ordered]@{
            'pipeline_contract.json'          = '1edbccda'
            'speedtree_handoff_contract.py'   = 'ca13f8cb'
            'speedtree_handoff_vectors.json'  = '541d180f'
          }
          Push-Location $vendored
          $head = (git rev-parse HEAD).Trim()
          $lines = @("| vendored file | expected blob | actual blob |", "| --- | --- | --- |")
          foreach ($file in $expected.Keys) {
            $blob = (git rev-parse --verify --quiet "HEAD:$file")
            $actual = if ($blob) { $blob.Trim().Substring(0, 8) } else { '(missing)' }
            if ($actual -ne $expected[$file]) {
              Write-Host "::warning::substance-tools $file drifted: expected $($expected[$file]), got $actual"
            }
            $lines += "| ``$file`` | ``$($expected[$file])`` | ``$actual`` |"
          }
          Pop-Location
          @(
            "### vendored substance-tools",
            "",
            "main at ``$head``",
            ""
          ) + $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Production code imports PIL lazily and there is no requirements file,
      # but test modules import Pillow, pytest, and numpy. pytest-xdist is the
      # test-only parallel runner. The versions live in ci-requirements.txt so
      # they are pinned and cacheable.
      - name: test-only dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r .github/ci-requirements.txt

      # Several suites build an expected path from tempfile.TemporaryDirectory()
      # and compare it against a value the production code has resolved(). On a
      # runner whose account name exceeds eight characters the default %TEMP%
      # resolves to its 8.3 short form (RUNNER~1 vs runneradmin) and those
      # comparisons fail -- a test-harness weakness, not a product defect: the
      # product canonicalizes correctly. Pinning TEMP to a short path keeps CI
      # measuring the product until the expectations are canonicalized too.
      #
      # The path below is the three characters C, :, \, t. It previously held a
      # literal TAB character, so New-Item failed with `The specified drive root
      # "C:\<tab>\" either does not exist` on every run and TEMP/TMP were set to
      # a path that does not exist; Python silently fell back to the default and
      # this step did nothing at all.
      - name: short temp path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'C:\t' | Out-Null
          "TEMP=C:\t" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=C:\t"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Fails in about a second on a syntax break or a contract drift, and
      # prints the production source revision the audit children verify
      # against, so a mismatch is visible here rather than mid-batch.
      - name: compile gate
        run: python sk_batch/code_compile_gate.py

      # pytest collects both unittest.TestCase methods and module-level test
      # functions, so every test runs once. Four workers match the Windows
      # runner's CPU allocation. Method-level scheduling avoids one very large
      # file becoming the tail of the whole job.
      #
      - name: parallel test suites
        timeout-minutes: 12
        run: >-
          python -m pytest -q -n 4 --dist load --import-mode=importlib
          --durations=10
          --ignore=sk_batch/tests/test_retry_progress.py
          --ignore=tests/test_launch_guard.py
          --ignore=tests/test_process_lifecycle.py
          --ignore=tests/test_shared_queue_runtime.py
          --ignore=pcg_st9_texture_batch/tests/test_00_issue_42_real_projection.py
          batch_ui_common/tests
          cluster_card_pipeline/tests
          pcg_st9_texture_batch/tests
          sk_batch/tests
          tests

      # These tests intentionally exercise the real machine-wide Job Object
      # receipt directory. Multiple xdist workers can race a cleanup against a
      # receipt replace, so keep the actual Windows lifecycle coverage serial.
      - name: Windows process lifecycle tests
        run: python -m unittest tests.test_process_lifecycle

      # Launch Guard's rotation test starts eight real processes and asserts
      # that only one of them owns the file lock at a time. Nesting that
      # process group inside a saturated xdist worker can distort the shared
      # Value instrumentation, so keep its concurrency test single-hosted.
      - name: Launch Guard multiprocessing tests
        run: python -m unittest tests.test_launch_guard

      # Windows spawn can exceed a five-second child handshake while four
      # pytest workers are saturated. This module tests real cross-process
      # queue ownership, so run it in an unloaded interpreter instead of
      # weakening its liveness deadline.
      - name: Shared queue multiprocessing tests
        run: python -m unittest tests.test_shared_queue_runtime

      # This suite launches real silent, slow, and hung helper processes and
      # deliberately distinguishes them at a 0.5-second liveness boundary.
      # Under xdist saturation a healthy helper can lose that entire budget
      # waiting for CPU, so preserve the production threshold and run the
      # timing contract in one unloaded pytest interpreter.
      - name: Retry progress process tests
        run: python -m pytest -q --import-mode=importlib sk_batch/tests/test_retry_progress.py

      # Generator Sync's Tk cache tests intentionally share one interpreter and
      # are order-sensitive under pytest collection; the established unittest
      # order is part of that suite's current test harness contract.
      - name: Generator Sync tests
        shell: pwsh
        timeout-minutes: 5
        run: |
          $out = & python -m unittest discover -s spm_generator_sync/tests 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $match = [regex]::Match($out, 'Ran (\d+) test')
          if (-not $match.Success -or [int]$match.Groups[1].Value -lt 1) {
            Write-Host "::error::Generator Sync collected no tests"
            exit 1
          }

      # Byte-compiling the packages catches a source file that no suite
      # imports; `-q` keeps the log to actual errors.
      - name: compileall
        run: python -m compileall -q batch_ui_common cluster_card_pipeline pcg_st9_texture_batch sk_batch spm_generator_sync

      # A tracked file left modified means a test wrote into the checkout,
      # which would make results order-dependent.
      - name: no working-tree side effects
        shell: pwsh
        run: |
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Host "::error::tests modified tracked files:`n$dirty"
            exit 1
          }

  # Three 78-93 MB real SpeedTree XML pairs prove that legacy and current
  # authoring projections agree. They used to be one serial test that alone
  # cost 162 seconds and formed the tail of every run. Keep the acceptance
  # coverage, but isolate it from the unit-test worker pool and process one
  # pair per worker while the ordinary tests run in the job above.
  real-xml-acceptance:
    # These large PCG projection fixtures protect offline authoring behavior,
    # not the runtime code merged by an ordinary PR. Keep the acceptance run on
    # every main commit and on explicit dispatch without making contributors
    # wait another 2.5 minutes before a PR can merge.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt

      - name: test-only dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r .github/ci-requirements.txt

      - name: real authored XML projection pairs
        run: >-
          python -m pytest -q -n 3 --dist load --import-mode=importlib
          --durations=3
          pcg_st9_texture_batch/tests/test_00_issue_42_real_projection.py
